<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>レシートアップロード</title>
    <style>
        body { font-family: sans-serif; margin: 2em; }
        h1 { color: #333; }
        .flash { background: #cee5F5; padding: 0.5em; border: 1px solid #aacbe2; }
        .form-upload { margin-top: 1em; padding: 1em; border: 1px solid #ccc; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>レシートをアップロードして家計簿データを作成</h1>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class=flash>
          {% for message in messages %}
            <p>{{ message }}</p>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <div class="form-upload">
        <form method=post enctype=multipart/form-data action="{{ url_for('upload_file') }}">
          <input type=file name=file>
          <input type=submit value=アップロード>
        </form>
    </div>

    <div style="margin-top: 2em;">
        <a href="{{ url_for('history') }}">保存済みデータ履歴を表示</a>
    </div>
</body>
</html>
